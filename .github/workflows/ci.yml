name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must match maven.compiler.release in pom.xml.
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # The suite once reported "103 tests" while skipping 17 of them, because a
      # class stayed @Disabled after the behaviour it described was removed. A
      # skip is invisible in a green build, so fail the job on any of them
      # rather than trusting the summary line.
      - name: Fail if any test was skipped
        run: |
          skipped=$(find target/surefire-reports -name '*.xml' \
            | xargs grep -ho 'skipped="[0-9]*"' \
            | grep -o '[0-9]*' \
            | awk '{total += $1} END {print total + 0}')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped test(s) skipped. Delete them or fix them - do not disable them."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The front end has no package.json and no node_modules - node:test and
      # node:assert are standard library.
      #
      # An explicit glob, not a bare `node --test`, which walks the whole tree
      # and would descend into target/ once Maven has run. And not
      # `node --test test/`: a bare directory is resolved as a module entry
      # point rather than scanned, so it fails with MODULE_NOT_FOUND.
      #
      # Two reporters at once: spec to the console because a human reads it,
      # tap to a file because the next step parses it and TAP's summary format
      # is documented where the console one is not. Writing the file directly
      # also avoids piping through tee, whose exit status would mask a failure.
      - name: Test the front end
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap  --test-reporter-destination=js-tests.log \
            test/*.test.js

      # The surefire guard above cannot see JavaScript, so a test.skip() in
      # boot.test.js would slip through the exact hole it exists to close.
      - name: Fail if any front-end test was skipped
        run: |
          skipped=$(grep -oE '^# skipped [0-9]+' js-tests.log | grep -oE '[0-9]+$' || echo 0)
          echo "Skipped front-end tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped front-end test(s) skipped. Delete them or fix them - do not disable them."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
